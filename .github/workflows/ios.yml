# Builds the iOS app on GitHub's Macs.
# - Every push to main: checks the app still compiles (simulator build, no Apple account needed).
# - Run manually ("Run workflow") with TestFlight ticked: signs the app and uploads it to TestFlight.
#   Needs these repository secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (see README).
name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload a build to TestFlight
        type: boolean
        default: true
      force:
        description: Build even if the tests fail (only for an urgent fix; read the test output first)
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that can be checked without an iPhone or a watch, on every push and before every TestFlight build:
  # the watch's logic on its own, whole games played between the phone app and the watch logic over a bad connection,
  # the phone app in a headless browser, and the database's functions and security rules in a real Postgres.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the test tools
        working-directory: tests
        run: npm ci && npx playwright install --with-deps chromium

      - name: Swift, for the watch logic
        run: swiftc --version || { echo "::error::No Swift compiler on this runner"; exit 1; }

      # The suites that check as they go decide whether a build goes ahead. The older walk-throughs run in real time and
      # can print something a second out, so here they are reported as warnings rather than stopping a build.
      - name: Run every test
        env:
          EVENINGS: 12
          WALKS: warn
        run: node tests/run.mjs

  ios:
    needs: tests
    if: ${{ always() && (needs.tests.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.force)) }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install
        run: npm ci

      - name: Copy the web app into the iOS project
        run: npm run build:web && npx cap sync ios

      # The watch's decisions (clock, changes coming due, what to believe from the phone) are plain Swift with no
      # watch frameworks, so whole games are played through them here on every build.
      - name: Test the watch logic
        run: |
          swiftc ios/App/Watch/MatchLogic.swift tests/watch/main.swift -o "$RUNNER_TEMP/watchtests"
          "$RUNNER_TEMP/watchtests"

      - name: Check it builds (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 60 \
            || { echo "--- compiler errors"; grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -40; exit 1; }

      - name: Note the signing certificates the account already has
        if: github.event_name == 'workflow_dispatch' && inputs.testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node scripts/asc-certs.mjs list > "$RUNNER_TEMP/certs-before.txt"

      - name: Sign and upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.testflight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is missing. See the README."; exit 1; fi
          done
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tail -n 60
          # What the watch app inside the archive says about itself, for when it won't install on a watch.
          WATCH="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Watch/Watch.app"
          echo "--- watch app"; plutil -p "$WATCH/Info.plist" || true; lipo -archs "$WATCH/Watch" || true; ls "$WATCH" || true
          sed "s/TEAM_ID/$APPLE_TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          echo "Uploaded build ${{ github.run_number }} (version $VERSION). It appears in TestFlight once Apple finishes processing, usually 5 to 15 minutes."

      # Each signed build makes Xcode create a development certificate on this throwaway Mac. Apple caps how many an
      # account can hold, so the one this build made is revoked again. Nothing that existed before the build is touched.
      - name: Revoke the certificate this build created
        if: always() && github.event_name == 'workflow_dispatch' && inputs.testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -s "$RUNNER_TEMP/certs-before.txt" ] || { echo "No list from before the build, so nothing is revoked."; exit 0; }
          node scripts/asc-certs.mjs revoke-new "$RUNNER_TEMP/certs-before.txt"
