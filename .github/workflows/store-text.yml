# Puts the App Store text in store/text (name, subtitle, description, keywords, promotional text) into App Store
# Connect, using the same App Store Connect key as the TestFlight builds (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8).
# Run by hand only. Leave "Send it" unticked first to see what would change.
name: Update App Store text

on:
  workflow_dispatch:
    inputs:
      send:
        description: Send it (unticked only shows what would change)
        type: boolean
        default: false

jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the text
        run: node scripts/asc-text.mjs check

      - name: ${{ inputs.send && 'Send it to App Store Connect' || 'Show what would change' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node scripts/asc-text.mjs ${{ inputs.send && 'send' || 'show' }}
