# Takes the Apple Watch screenshots for the App Store listing, from the real watch app running in a simulator.
# Run it by hand (Actions > Watch screenshots > Run workflow); the images are attached to the run.
name: Watch screenshots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run build:web && npx cap sync ios
      - name: Build the watch app for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -target Watch -configuration Debug -sdk watchsimulator \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/wbuild" build | tail -n 20
      - name: Take the screenshots
        run: |
          set -x
          xcrun simctl list devices available | grep -i watch || true
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; w=[x for k in d for x in d[k] if 'Apple Watch' in x['name']]; p=[x for x in w if '46mm' in x['name']] or [x for x in w if '45mm' in x['name']] or w; print(p[-1]['udid'] if p else '')")
          if [ -z "$UDID" ]; then
            xcodebuild -downloadPlatform watchOS
            RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='watchOS' and x['isAvailable']]; print(r[-1]['identifier'])")
            UDID=$(xcrun simctl create shots "Apple Watch Series 10 (46mm)" "$RT")
          fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find wbuild -name Watch.app -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          for page in 0 1 2 3; do
            SIMCTL_CHILD_TACTICS_DEMO=$page xcrun simctl launch --terminate-running-process "$UDID" com.randomedp.aipoweredtactics.watchkitapp
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/watch-$page.png"
          done
          sips -g pixelWidth -g pixelHeight shots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: watch-screenshots
          path: shots
